<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滑坡运动过程动力模拟 · Bingham / Voellmy 对比</title>
<meta name="description" content="论文补充材料：Bingham 与 Voellmy 两种流变模型下的滑坡运动过程动力模拟动画。">
<meta property="og:title" content="滑坡运动过程动力模拟 · Bingham / Voellmy 对比">
<meta property="og:description" content="论文补充材料：Bingham 与 Voellmy 两种流变模型下的滑坡运动过程动力模拟动画。">
<meta property="og:type" content="website">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f4f4f5;
    color: #18181b;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(980px, 100%);
    background: #fff;
    border-radius: 16px;
    padding: 28px 28px 20px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 12px 32px rgba(0, 0, 0, .08);
  }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(20px, 3vw, 27px);
    font-weight: 650;
    letter-spacing: .01em;
  }
  .sub {
    margin: 0 0 4px;
    color: #71717a;
    font-size: 14px;
  }
  figure { margin: 0; }
  .model { margin-top: 26px; }
  .model:first-of-type { margin-top: 22px; }
  .model-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }
  .model-head h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .meta {
    display: flex;
    align-items: baseline;
    gap: 10px;
    color: #a1a1aa;
    font-size: 12px;
    white-space: nowrap;
  }
  .meta a { color: #52525b; text-decoration: none; border-bottom: 1px dotted #a1a1aa; }
  .meta a:hover { color: #18181b; border-bottom-color: #18181b; }
  .stage {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: #e4e4e7;
    isolation: isolate;
  }
  .stage img {
    display: block;
    width: 100%;
    height: auto;
    cursor: zoom-in;
  }
  .stage:fullscreen { border-radius: 0; background: #000; display: flex; align-items: center; justify-content: center; }
  .stage:fullscreen img { width: 100%; max-height: 100vh; object-fit: contain; cursor: zoom-out; }
  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #e4e4e7;
    color: #52525b;
    font-size: 14px;
    transition: opacity .3s ease;
  }
  .loading small { color: #a1a1aa; font-size: 12px; }
  .loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 26px; height: 26px;
    border: 3px solid #d4d4d8;
    border-top-color: #52525b;
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .caption {
    margin: 10px 2px 0;
    color: #71717a;
    font-size: 13px;
    line-height: 1.6;
  }
  footer {
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px solid #f0f0f1;
    color: #a1a1aa;
    font-size: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: space-between;
  }
  @media (max-width: 560px) {
    .card { padding: 20px 16px 16px; border-radius: 12px; }
    body { padding: 12px; }
    .model-head { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>滑坡运动过程动力模拟</h1>
    <p class="sub">Bingham / Voellmy 两种流变模型对比 · 动态演示（论文补充材料）</p>

    <figure class="model">
      <div class="model-head">
        <h2>Bingham 流变模型</h2>
        <span class="meta"><span>6.4 MB</span><a href="flow.gif" download>下载 GIF</a></span>
      </div>
      <div class="stage">
        <img src="flow.gif" alt="Bingham 流变模型下的滑坡运动过程动画" decoding="async">
        <div class="loading">
          <div class="spinner" aria-hidden="true"></div>
          <span>动画加载中…</span>
          <small>6.4 MB，请稍候</small>
        </div>
      </div>
      <figcaption class="caption">左上角为模拟时间 <em>t</em>。点击画面可全屏观看。</figcaption>
    </figure>

    <figure class="model">
      <div class="model-head">
        <h2>Voellmy 流变模型</h2>
        <span class="meta"><span>4.5 MB</span><a href="voellmy.gif" download>下载 GIF</a></span>
      </div>
      <div class="stage">
        <img src="voellmy.gif" alt="Voellmy 流变模型下的滑坡运动过程动画" decoding="async">
        <div class="loading">
          <div class="spinner" aria-hidden="true"></div>
          <span>动画加载中…</span>
          <small>4.5 MB，请稍候</small>
        </div>
      </div>
      <figcaption class="caption">左上角为模拟时间 <em>t</em>。点击画面可全屏观看。</figcaption>
    </figure>

    <footer>
      <span>Supplementary Material</span>
      <span>如页面加载缓慢，可下载 GIF 后本地查看</span>
    </footer>
  </main>

<script>
  (function () {
    document.querySelectorAll('.model').forEach(function (model) {
      var stage = model.querySelector('.stage');
      var img = model.querySelector('img');
      var loading = model.querySelector('.loading');

      function ready() { loading.classList.add('hidden'); }
      if (img.complete && img.naturalWidth > 0) ready();
      img.addEventListener('load', ready);
      img.addEventListener('error', function () {
        loading.innerHTML = '<span>动画加载失败</span><small>请刷新页面或下载 GIF</small>';
      });

      function toggleFullscreen() {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else if (stage.requestFullscreen) {
          stage.requestFullscreen();
        }
      }
      stage.addEventListener('click', toggleFullscreen);
    });
  })();
</script>
</body>
</html>
